
name: Build Franyer AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.gradle'
      - '**.gradle.kts'
      - 'app/src/**'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Configure Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Ensure Material dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          content = path.read_text()

          dependency = "implementation 'com.google.android.material:material:1.11.0'"

          if dependency not in content:
              marker = "dependencies {"
              if marker not in content:
                  raise SystemExit("Could not find dependencies block in app/build.gradle")

              content = content.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )
              path.write_text(content)

          print("Material dependency verified.")

          PY

      - name: Build Franyer AI
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Franyer-AI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
