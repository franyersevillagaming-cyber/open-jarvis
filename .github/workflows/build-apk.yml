name: Build Franyer AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/src/**'
      - '**.gradle'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Give Gradle more memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> ~/.gradle/gradle.properties

      - name: Apply source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          J = Path("app/src/main/java/com/openjarvis")

          def edit(path, old, new, all_=False):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit("PATCH FAILED: no encontre " + repr(old) + " en " + str(path))
              p.write_text(s.replace(old, new) if all_ else s.replace(old, new, 1))

          # 1) Dependencias y compilador de Compose
          edit("app/build.gradle", "kotlinCompilerExtensionVersion '1.5.5'", "kotlinCompilerExtensionVersion '1.5.4'")
          edit("app/build.gradle", "dependencies {",
               "dependencies {\n"
               "    implementation 'com.google.android.material:material:1.11.0'\n"
               "    implementation 'androidx.activity:activity-compose:1.8.2'")

          # 2) Import que no existe
          edit(J / "accessibility/ActionExecutor.kt", "import com.openjarvis.agent.ActionPlan\n", "")

          # 3) Iconos AutoMirrored (no existen en esta version de Compose)
          for f in J.rglob("*.kt"):
              s = f.read_text()
              t = s.replace("icons.automirrored.filled.", "icons.filled.").replace("Icons.AutoMirrored.Filled.", "Icons.Filled.")
              if t != s:
                  f.write_text(t)

          # 4) Actividad principal en el paquete correcto
          m = "app/src/main/AndroidManifest.xml"
          edit(m, 'android:name=".MainActivity"', 'android:name=".ui.MainActivity"')
          edit(m, 'android:parentActivityName=".MainActivity"', 'android:parentActivityName=".ui.MainActivity"')

          # 5) Nombre de parametro incorrecto
          edit(J / "agent/AgentCore.kt", "cleanCommand = safeCommand,", "command = safeCommand,")

          # 6) Metodos que se llamaban pero no existian
          edit(J / "graphify/GraphifyRepository.kt", "    data class TaskStats(",
               "    fun logProviderFailure(provider: String, error: String) {\n"
               "        android.util.Log.w(\"Graphify\", \"Provider failed: $provider - $error\")\n"
               "    }\n\n"
               "    fun logNotification(summary: String) {\n"
               "        android.util.Log.d(\"Graphify\", \"Notification: $summary\")\n"
               "    }\n\n"
               "    data class TaskStats(")
          edit(J / "voice/VoiceManager.kt", "    fun release() {",
               "    fun initialize() {\n"
               "        ttsEngine.setSpeechRate(getSpeechRate())\n"
               "    }\n\n"
               "    fun release() {")

          # 7) Paquete de tema que faltaba
          theme = J / "ui/theme"
          theme.mkdir(parents=True, exist_ok=True)
          (theme / "Theme.kt").write_text('''package com.openjarvis.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          object VoidColor {
              val Void950 = Color(0xFF05050A)
              val Void900 = Color(0xFF0A0A12)
              val Void800 = Color(0xFF12121C)
              val Void700 = Color(0xFF1B1B28)
              val Void600 = Color(0xFF262636)
              val Violet = Color(0xFF8B5CF6)
              val VioletDim = Color(0xFF5B3FB0)
              val Cyan = Color(0xFF22D3EE)
              val Green = Color(0xFF34D399)
              val Red = Color(0xFFF87171)
              val Amber = Color(0xFFFBBF24)
              val TextPrimary = Color(0xFFF1F1F7)
              val TextSecondary = Color(0xFFA1A1B5)
              val TextDisabled = Color(0xFF5E5E73)
              val BorderSubtle = Color(0xFF2A2A3A)
              val BorderGlow = Color(0xFF6D4AE0)
          }

          private val JarvisColors = darkColorScheme(
              primary = VoidColor.Violet,
              secondary = VoidColor.Cyan,
              background = VoidColor.Void950,
              surface = VoidColor.Void900,
              error = VoidColor.Red,
              onPrimary = VoidColor.TextPrimary,
              onSecondary = VoidColor.Void950,
              onBackground = VoidColor.TextPrimary,
              onSurface = VoidColor.TextPrimary,
              onError = VoidColor.Void950
          )

          @Composable
          fun OpenJarvisTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = JarvisColors, content = content)
          }
          ''')
          print("Todos los parches aplicados")
          PY

      - name: Configure Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Franyer AI
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Franyer-AI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
